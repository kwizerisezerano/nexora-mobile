name: Release APK

# Builds a signed release APK and publishes it to a public GitHub Release so
# anyone can download and install the app for free (no Play Store required).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Info-level deprecation notices (e.g. material.dart) must not fail the
        # release; errors and warnings still do.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        # Sign with the release keystore when the secrets are configured;
        # otherwise fall back to the debug key (a plain sideload build).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets not set; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexora-release.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/nexora-release.jks"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build release APK
        # Per-ABI split keeps the download ~3x smaller: the universal build ships
        # three copies of Flutter's native engine (~50 MB of libs alone).
        run: |
          set -o pipefail
          if flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build.log; then
            echo "APK built successfully."
          else
            # Surface the tail of the build log as annotations so the failure
            # reason is visible from the check-run annotations API.
            tail -n 8 /tmp/build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            exit 1
          fi
          # Publish the arm64 build under the stable name the website links to,
          # and keep the 32-bit build for older devices. x86_64 (emulators only)
          # is not distributed.
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
