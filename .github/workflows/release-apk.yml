name: Release APK

# Builds a signed release APK and publishes it to a public GitHub Release so
# anyone can download and install the app for free (no Play Store required).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Info-level deprecation notices (e.g. material.dart) must not fail the
        # release; errors and warnings still do.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          if flutter build apk --release 2>&1 | tee /tmp/build.log; then
            echo "APK built successfully."
          else
            # Surface the tail of the build log as annotations so the failure
            # reason is visible from the check-run annotations API.
            tail -n 8 /tmp/build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
